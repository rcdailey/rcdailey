name: Profile 3D contributions

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_PAT }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898237+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib
          if git commit -m "chore: regenerate 3D contribution calendar"; then
            git push
          fi
